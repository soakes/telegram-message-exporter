[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-message-exporter"
dynamic = ["version"]
description = "Offline recovery and export tool for Telegram for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pycryptodomex>=3.20.0",
  "mmh3==4.1.0",
  "sqlcipher3>=0.5.2",
]

# Exact pins so a new tool release reaches CI through a Dependabot pull request
# instead of failing main unannounced (ruff 0.17 widened its default rules).
[project.optional-dependencies]
dev = [
  "black==26.10.1",
  "build==1.6.1",
  "pylint==4.1.3",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "twine==7.0.0",
]

[project.scripts]
telegram-exporter = "telegram_message_exporter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
